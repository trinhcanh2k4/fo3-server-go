<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập — FO3 Việt Nam</title>
<style>
  :root{--bg:#0a0f1a;--panel:#111a2b;--field:#0d1524;--line:#1e2c47;
    --txt:#e8eefc;--soft:#9db1d8;--lime:#b6f34a;--lime2:#8fd41f;--err:#ff7a7a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:15px/1.55 "Segoe UI",system-ui,Arial,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:36px 16px}
  a{color:var(--lime);text-decoration:none}
  .brand{font-weight:800;font-size:22px;color:#fff;margin-bottom:26px}
  .brand b{color:var(--lime)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:30px 30px 24px;width:100%;max-width:400px}
  h1{font-size:23px;font-weight:900;color:#fff;margin-bottom:4px}
  .sub{color:var(--soft);font-size:14px;margin-bottom:20px}
  label{display:block;font-size:12.5px;font-weight:700;letter-spacing:.6px;
    text-transform:uppercase;color:var(--soft);margin:16px 0 6px}
  input{width:100%;background:var(--field);border:1px solid var(--line);border-radius:9px;
    color:var(--txt);padding:11px 13px;font-size:15px;outline:none}
  input:focus{border-color:var(--lime)}
  button{width:100%;margin-top:24px;background:var(--lime);color:#0c1405;border:none;
    border-radius:10px;padding:13px;font-size:16px;font-weight:800;cursor:pointer}
  button:hover{background:var(--lime2)}
  button:disabled{opacity:.55;cursor:wait}
  .msg{margin-top:16px;font-size:14px;min-height:20px}
  .msg.err{color:var(--err)}
  .msg.ok{color:var(--lime)}
  .alt{margin-top:20px;text-align:center;color:var(--soft);font-size:14px}
</style>
</head>
<body>
<a class="brand" href="/">FO3 <b>VIỆT NAM</b></a>
<div class="card">
  <h1>Đăng nhập</h1>
  <p class="sub">Tài khoản HLV của bạn — dùng chung cho web và trong game.</p>
  <form id="f" autocomplete="off">
    <label for="user">Tên đăng nhập</label>
    <input id="user" type="text" maxlength="24" required>
    <label for="pass">Mật khẩu</label>
    <input id="pass" type="password" required>
    <button id="btn" type="submit">Đăng nhập</button>
    <div class="msg" id="msg"></div>
  </form>
  <p class="alt">Chưa có tài khoản? <a href="/register">Đăng ký ngay</a></p>
</div>
<script>
document.getElementById("f").addEventListener("submit", async function(ev){
  ev.preventDefault();
  var msg = document.getElementById("msg"), btn = document.getElementById("btn");
  var u = document.getElementById("user").value.trim();
  var p = document.getElementById("pass").value;
  msg.className = "msg";
  btn.disabled = true; msg.textContent = "Đang đăng nhập…";
  try {
    var r = await fetch("/launcher/login", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({username: u, password: p, action: "login"})});
    var d = await r.json();
    if (d.result) {
      msg.textContent = "Đăng nhập thành công! Mở FO3Launcher để vào game nhé.";
      msg.classList.add("ok");
    } else {
      msg.textContent = d.message || "Đăng nhập thất bại.";
      msg.classList.add("err");
    }
  } catch(e) {
    msg.textContent = "Không kết nối được server. Thử lại sau.";
    msg.classList.add("err");
  }
  btn.disabled = false;
});
</script>
</body>
</html>
